apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: nginx, namespace: argocd}
spec:
  source:          # ← 어디서
    repoURL: https://github.com/kopo1007/gitops
    path: apps/nginx
    targetRevision: main
  destination:     # ← 어디에
    server: https://kubernetes.default.svc
    namespace: web
